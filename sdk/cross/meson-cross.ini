# meson cross file: webOS SDK with the writable sysroot copy /work/sysroot
[constants]
sdk = '/opt/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot'
sysroot = '/work/sysroot'
flags = ['--sysroot=' + sysroot, '-pipe', '-D_LARGEFILE_SOURCE', '-D_LARGEFILE64_SOURCE', '-D_FILE_OFFSET_BITS=64']

[binaries]
c = sdk + '/bin/arm-webos-linux-gnueabi-gcc'
cpp = sdk + '/bin/arm-webos-linux-gnueabi-g++'
ar = sdk + '/bin/arm-webos-linux-gnueabi-ar'
strip = sdk + '/bin/arm-webos-linux-gnueabi-strip'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = flags
cpp_args = flags
c_link_args = ['--sysroot=' + sysroot]
cpp_link_args = ['--sysroot=' + sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/share/pkgconfig'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
